<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interfaces de candidatos y empresas de WorkConnect, portal de empleo de El Salvador."
    />
    <title>WorkConnect - Perfiles y vacantes</title>
    <link rel="stylesheet" href="/css/estilos.css" />
    <link rel="stylesheet" href="/css/persona2.css" />
  </head>
  <body>
    <div class="aplicacion-raiz">
      <header class="encabezado">
        <div class="encabezado-interior persona2-encabezado">
          <a class="persona2-marca" href="/" aria-label="WorkConnect, volver al portal">
            <span class="persona2-logo" aria-hidden="true">W</span>
            <span><strong>WorkConnect</strong><small>Talento y oportunidades</small></span>
          </a>
          <a class="persona2-volver" href="/" aria-label="Volver al portal">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 20 20" fill="none">
              <path d="M8.25 4.5 2.75 10l5.5 5.5M3.5 10h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Volver al portal</span>
          </a>
        </div>
      </header>

      <main class="contenedor-principal persona2-principal">
        <div class="persona2-introduccion">
          <h1 class="titulo-pantalla">Candidatos y empresas</h1>
          <p class="subtitulo-pantalla">
            Perfiles, vacantes y postulaciones de WorkConnect.
          </p>
        </div>

        <nav
          class="persona2-navegacion"
          aria-label="Secciones de tu cuenta"
          hidden
        ></nav>

        <div id="persona2-contenido" class="area-contenido" aria-live="polite"></div>
      </main>

      <footer class="pie-pagina">
        <div class="pie-pagina-contenido">
          <p class="pie-marca">WorkConnect © 2026 · Portal de Empleo de El Salvador</p>
          <p class="pie-detalle">Perfiles, vacantes y postulaciones</p>
        </div>
      </footer>
    </div>
    <script type="module" src="/js/persona2.js"></script>
  </body>
</html>
